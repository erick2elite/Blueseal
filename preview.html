<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>BLUESEAL MOTOR MANAGER'S LTD (BMM) — Precision in Every Mile</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:ital,wght@0,700;0,800;0,900;1,700;1,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --black:        #060608;
      --navy:         #0a0a0e;
      --navy-2:       #111117;
      --navy-3:       #1a1a23;
      --red:          #e11d48;
      --red-lt:       #f43f5e;
      --red-dk:       #be123c;
      --red-glow:     rgba(225, 29, 72, 0.4);
      --gold:         #f59e0b;
      --gold-lt:      #fbbf24;
      --gold-dk:      #d97706;
      --green:        #16a34a;
      --wa:           #25D366;
      --bg:           #f8fafc;
      --surface:      #ffffff;
      --border:       #e2e8f0;
      --text:         #0f172a;
      --text-2:       #475569;
      --text-3:       #94a3b8;
      --r-sm:         8px;
      --r:            16px;
      --r-lg:         24px;
      --shadow-sm:    0 1px 3px rgba(0,0,0,.08);
      --shadow:       0 4px 24px rgba(0,0,0,.1);
      --shadow-lg:    0 16px 48px rgba(0,0,0,.16);
      --trans:        .2s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
    img { max-width: 100%; }

    /* ── NAVBAR ── */
    .navbar {
      position: sticky; top: 0; z-index: 900;
      display: flex; align-items: center; justify-content: space-between;
      padding: .6rem 1.25rem;
      background: #000000;
      box-shadow: 0 4px 24px rgba(0,0,0,.6);
      border-bottom: 1.5px solid rgba(225, 29, 72, 0.35);
      gap: .5rem;
    }
    .navbar-brand { display: flex; align-items: center; text-decoration: none; cursor: pointer; }
    .navbar-logo  { height: 48px; width: auto; object-fit: contain; display: block; border-radius: 4px; }
    .navbar-actions { display: flex; gap: .4rem; align-items: center; }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
      border: none; border-radius: var(--r-sm);
      font-family: inherit; font-weight: 700; font-size: .875rem;
      cursor: pointer; padding: .58rem 1.15rem; min-height: 42px;
      transition: filter var(--trans), transform var(--trans), box-shadow var(--trans);
      white-space: nowrap; line-height: 1; text-decoration: none;
    }
    .btn:active:not(:disabled) { transform: scale(.96); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-primary   { background: var(--red); color: #ffffff; box-shadow: 0 4px 16px rgba(225,29,72,.35); }
    .btn-primary:hover   { filter: brightness(1.12); box-shadow: 0 6px 22px rgba(225,29,72,.5); }
    .btn-nav       { background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.16); }
    .btn-nav:hover { background: rgba(255,255,255,.18); }
    .btn-nav.active { background: var(--red); color: #fff; border-color: var(--red-lt); box-shadow: 0 0 14px rgba(225,29,72,.45); }
    .btn-success   { background: var(--green); color: #fff; }
    .btn-success:hover { filter: brightness(1.1); }
    .btn-wa        { background: var(--wa);    color: #fff; }
    .btn-wa:hover  { filter: brightness(1.08); }
    .btn-danger    { background: #dc2626;      color: #fff; }
    .btn-danger:hover { filter: brightness(1.1); }
    .btn-warning   { background: #f59e0b;      color: #fff; }
    .btn-warning:hover { filter: brightness(1.1); }
    .btn-ghost     { background: transparent; border: 1.5px solid var(--border); color: var(--text-2); }
    .btn-ghost:hover { background: var(--bg); }
    .btn-outline-red { background: transparent; border: 1.5px solid var(--red); color: var(--red); }
    .btn-outline-red:hover { background: var(--red); color: #fff; box-shadow: 0 4px 16px rgba(225,29,72,.35); }
    .btn-sm  { padding: .4rem .75rem; font-size: .8rem; min-height: 36px; }
    .btn-lg  { padding: .85rem 1.6rem; font-size: 1rem; border-radius: var(--r); min-height: 48px; }

    /* ── HERO ── */
    .hero {
      background: radial-gradient(circle at 50% 15%, #240c12 0%, #100b0e 50%, #050506 100%);
      position: relative; overflow: hidden;
      padding: clamp(2.4rem, 7.5vw, 5.2rem) 1rem clamp(1.8rem, 5.5vw, 4rem);
      text-align: center;
      border-bottom: 1.5px solid rgba(225, 29, 72, 0.2);
    }
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23e11d48' fill-opacity='0.035'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .hero-content { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; }
    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: .45rem;
      background: rgba(225,29,72,.14); border: 1px solid rgba(225,29,72,.35);
      color: #ff4d6d; font-size: .82rem; font-weight: 800; letter-spacing: .6px;
      text-transform: uppercase; padding: .35rem .95rem; border-radius: 20px;
      margin-bottom: .95rem;
    }
    .hero h1 {
      font-size: clamp(1.75rem, 6.5vw, 3.3rem);
      font-weight: 900; color: #ffffff; line-height: 1.15;
      letter-spacing: -.5px; margin-bottom: .85rem;
    }
    .hero h1 .brand-highlight {
      color: var(--red);
      font-style: italic;
      font-family: 'Montserrat', sans-serif;
      text-shadow: 0 0 25px rgba(225,29,72,.4);
    }
    .hero p { font-size: clamp(.875rem, 2.8vw, 1.05rem); color: rgba(255,255,255,.82); line-height: 1.55; max-width: 540px; margin: 0 auto 1.5rem; }
    .hero-stats {
      display: flex; justify-content: center; gap: clamp(.85rem, 4vw, 3rem);
      margin-top: 1.85rem; flex-wrap: wrap;
    }
    .hero-stat { text-align: center; }
    .hero-stat-num { font-size: clamp(1.35rem, 4.5vw, 2rem); font-weight: 900; color: var(--red-lt); line-height: 1; text-shadow: 0 0 15px rgba(225,29,72,.3); }
    .hero-stat-label { font-size: .72rem; color: rgba(255,255,255,.7); margin-top: .2rem; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }

    /* ── MAIN WRAPPER ── */
    .main-wrapper { max-width: 1160px; margin: 1.25rem auto; padding: 0 .85rem; display: flex; flex-direction: column; gap: 1rem; }

    /* ── CATEGORY PILLS ── */
    .category-pills { display: flex; gap: .5rem; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: .25rem; }
    .category-pill {
      border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
      padding: .45rem .95rem; border-radius: 24px; font-size: .82rem; font-weight: 700;
      white-space: nowrap; cursor: pointer; transition: all var(--trans);
    }
    .category-pill:hover { border-color: var(--red); color: var(--text); }
    .category-pill.active { background: var(--red); color: #fff; border-color: var(--red-lt); box-shadow: 0 4px 14px rgba(225,29,72,.35); }

    /* ── SEARCH & SORT ── */
    .search-sort-container { display: flex; gap: .65rem; align-items: center; flex-wrap: wrap; }
    .search-wrap {
      background: var(--surface);
      border-radius: var(--r);
      padding: .75rem 1rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      display: flex; gap: .65rem; align-items: center;
    }
    .search-input {
      flex: 1; padding: .65rem .85rem;
      border-radius: var(--r-sm); border: 1.5px solid var(--border);
      font-family: inherit; font-size: 16px;
      background: var(--bg); color: var(--text);
      outline: none; transition: border-color var(--trans), box-shadow var(--trans);
      min-height: 44px;
    }
    .search-input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(225,29,72,.15); }
    .search-input::placeholder { color: var(--text-3); }

    .sort-wrap {
      display: flex; align-items: center; gap: .5rem; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--r); padding: .4rem .75rem;
      height: 44px;
    }
    .sort-select {
      border: none; background: transparent; font-family: inherit; font-size: .85rem;
      color: var(--text); outline: none; cursor: pointer; font-weight: 600;
    }

    .badge-count {
      position: absolute; top: -7px; right: -7px; background: var(--red);
      color: #fff; border-radius: 50%; width: 18px; height: 18px;
      font-size: .68rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }

    /* ── FILTER PANEL ── */
    .filter-panel {
      background: var(--surface);
      border-radius: var(--r);
      padding: 1.1rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }
    .filter-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: .85rem; }
    .filter-grid   { display: grid; grid-template-columns: repeat(2, 1fr); gap: .5rem; }
    .filter-select {
      width: 100%; padding: .65rem .8rem;
      border-radius: var(--r-sm); border: 1.5px solid var(--border);
      background: var(--bg); font-family: inherit; font-size: 16px;
      color: var(--text); cursor: pointer; outline: none;
      transition: border-color var(--trans); min-height: 44px;
    }
    .filter-select:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(225,29,72,.12); }

    /* ── CAR GRID ── */
    .car-grid { display: grid; grid-template-columns: 1fr; gap: 1.15rem; }

    /* ── CAR CARD ── */
    .car-card {
      background: var(--surface);
      border-radius: var(--r);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      transition: box-shadow var(--trans), transform var(--trans);
      display: flex; flex-direction: column;
      cursor: default;
    }
    .car-card:hover { box-shadow: 0 12px 36px rgba(0,0,0,.12); transform: translateY(-3px); border-color: rgba(225,29,72,.2); }

    .car-image-wrap { position: relative; background: var(--bg); overflow: hidden; }
    .car-image { width: 100%; height: 210px; object-fit: cover; display: block; transition: transform .4s ease; cursor: pointer; }
    .car-card:hover .car-image { transform: scale(1.03); }

    .car-badge {
      position: absolute; top: 10px; left: 10px;
      padding: .25rem .65rem; border-radius: 20px;
      font-size: .7rem; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
      backdrop-filter: blur(8px);
    }
    .car-badge--new  { background: rgba(22,163,74,.92);  color: #fff; }
    .car-badge--used { background: rgba(225,29,72,.92); color: #fff; }

    .car-img-counter {
      position: absolute; top: 10px; right: 10px;
      background: rgba(0,0,0,.7); color: #fff;
      font-size: .7rem; font-weight: 700;
      padding: .25rem .6rem; border-radius: 20px; backdrop-filter: blur(4px);
    }

    .btn-share-floating {
      position: absolute; bottom: 10px; right: 10px;
      background: rgba(0,0,0,.65); color: #fff; border: none;
      width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; backdrop-filter: blur(4px); transition: background var(--trans);
    }
    .btn-share-floating:hover { background: var(--red); }

    .car-thumbs { display: flex; gap: 6px; padding: .55rem .75rem .45rem; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .car-thumb { flex-shrink: 0; width: 48px; height: 38px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 2.5px solid transparent; opacity: .65; transition: border-color var(--trans), opacity var(--trans); }
    .car-thumb.active { border-color: var(--red); opacity: 1; }

    .car-body { padding: .85rem .85rem 1rem; flex: 1; display: flex; flex-direction: column; gap: .35rem; }
    .car-title { font-size: 1.02rem; font-weight: 800; color: var(--text); line-height: 1.35; }
    .car-price-wrap { display: flex; align-items: baseline; gap: .5rem; margin-top: .1rem; }
    .car-price { font-size: 1.2rem; font-weight: 900; color: var(--text); letter-spacing: -.5px; }
    .car-price-label { font-size: .75rem; font-weight: 600; color: var(--text-3); }

    .car-meta { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .25rem; }
    .car-pill {
      display: inline-flex; align-items: center; gap: .3rem;
      font-size: .72rem; font-weight: 600; color: var(--text-2);
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 20px; padding: .22rem .6rem;
    }
    .car-pill i { color: var(--red); font-size: .75rem; }

    .car-details-expanded {
      margin-top: .65rem; padding: .8rem; background: var(--bg);
      border-radius: var(--r-sm); border: 1px solid var(--border);
      font-size: .82rem; color: var(--text-2);
      display: grid; grid-template-columns: 1fr 1fr; gap: .4rem .75rem;
    }
    .car-details-expanded strong { color: var(--text-3); display: block; font-size: .7rem; text-transform: uppercase; letter-spacing: .4px; margin-bottom: .1rem; }
    .car-details-expanded span { font-weight: 700; color: var(--text); }

    .car-actions { display: grid; grid-template-columns: 1fr 1.15fr 1.15fr; gap: .4rem; margin-top: .85rem; }
    .car-actions .btn { font-size: .8rem; padding: .65rem .35rem; border-radius: var(--r-sm); min-height: 42px; }

    /* ── FLOATING WA BUTTON ── */
    .fab-wa {
      position: fixed; bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px)); right: 1.15rem; z-index: 800;
      width: 56px; height: 56px;
      background: var(--wa);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 24px rgba(37,211,102,.45);
      color: #fff; font-size: 1.55rem; text-decoration: none;
      transition: transform var(--trans), box-shadow var(--trans);
    }
    .fab-wa:hover { transform: scale(1.1); box-shadow: 0 8px 32px rgba(37,211,102,.6); }

    /* ── TOAST NOTIFICATION ── */
    .toast-notification {
      position: fixed; top: 1.25rem; left: 50%; transform: translateX(-50%); z-index: 9999;
      background: #0f172a; color: #fff; border: 1px solid rgba(225,29,72,.4);
      padding: .75rem 1.25rem; border-radius: 30px; font-size: .85rem; font-weight: 600;
      display: flex; align-items: center; gap: .5rem; box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }

    /* ── MODALS ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center; z-index: 9999; cursor: zoom-out; padding: 1rem; }
    .modal-img     { max-width: 100%; max-height: 90vh; object-fit: contain; border-radius: var(--r-sm); cursor: default; }
    .modal-close   { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; background: rgba(255,255,255,.15); border: none; color: #fff; width: 44px; height: 44px; border-radius: 50%; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .modal-close:hover { background: rgba(225,29,72,.7); }

    .modal-card {
      background: var(--surface); border-radius: var(--r-lg); padding: clamp(1.25rem, 4vw, 2rem);
      width: 100%; max-width: 480px; box-shadow: var(--shadow-lg); cursor: default;
      border: 1px solid var(--border);
    }

    .calc-group { margin-bottom: 1.15rem; }
    .calc-range { width: 100%; height: 6px; border-radius: 4px; accent-color: var(--red); cursor: pointer; margin-top: .4rem; }
    .calc-result-box {
      background: #0a0a0e; color: #fff; border-radius: var(--r-sm); padding: 1.2rem;
      text-align: center; border: 1px solid rgba(225,29,72,.3); margin: 1.15rem 0;
    }

    /* ── FOOTER ── */
    .footer { background: #060608; color: #94a3b8; padding: 2.5rem 1rem 1.5rem; border-top: 1px solid rgba(225,29,72,.2); }
    .footer-grid  { display: grid; grid-template-columns: 1fr; gap: 2rem; max-width: 1160px; margin: 0 auto; }
    .footer h3 { font-size: .95rem; font-weight: 800; color: #fff; margin-bottom: .85rem; padding-bottom: .5rem; border-bottom: 2px solid var(--red); display: inline-block; }
    .footer p  { margin-bottom: .4rem; line-height: 1.6; font-size: .875rem; }
    .footer a  { color: #64748b; text-decoration: none; transition: color var(--trans); }
    .footer a:hover { color: var(--red); }
    .footer-bottom { max-width: 1160px; margin: 1.75rem auto 0; padding-top: 1.25rem; border-top: 1px solid #1a1a24; display: flex; flex-direction: column; align-items: center; gap: .75rem; font-size: .8rem; color: #475569; text-align: center; }

    /* ── ADMIN STYLES ── */
    .admin-wrap { max-width: 1000px; margin: 1.25rem auto; padding: 0 .85rem 4rem; }
    .admin-card { background: var(--surface); border-radius: var(--r-lg); padding: 1.35rem; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .admin-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .85rem; margin-bottom: 1.35rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .admin-tabs { display: flex; gap: .4rem; }
    
    .stats-bar { display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem; margin-bottom: 1.35rem; }
    .stat-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-sm); padding: .85rem; border-left: 4px solid var(--red); }
    .stat-box-num { font-size: 1.25rem; font-weight: 900; color: var(--text); }
    .stat-box-label { font-size: .7rem; color: var(--text-2); text-transform: uppercase; font-weight: 700; margin-top: .15rem; }

    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin-bottom: .75rem; }
    .form-label { font-size: .8rem; font-weight: 700; color: var(--text-2); display: block; margin-bottom: .25rem; }
    .form-input, .form-select {
      width: 100%; padding: .75rem .9rem;
      border-radius: var(--r-sm); border: 1.5px solid var(--border);
      font-family: inherit; font-size: 16px; color: var(--text);
      background: var(--bg); outline: none; min-height: 44px;
      transition: border-color var(--trans), box-shadow var(--trans);
    }
    .form-input:focus, .form-select:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(225,29,72,.12); }

    .image-upload-zone { border: 2px dashed var(--border); border-radius: var(--r); padding: 1.5rem 1rem; text-align: center; cursor: pointer; transition: border-color var(--trans), background var(--trans); color: var(--text-2); display: block; }
    .image-upload-zone:hover { border-color: var(--red); background: rgba(225,29,72,.03); }
    .image-upload-zone input[type="file"] { display: none; }
    .image-previews { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: .6rem; margin-top: .75rem; }
    .preview-item { position: relative; border-radius: var(--r-sm); overflow: hidden; aspect-ratio: 4/3; }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; }
    .preview-remove { position: absolute; top: 4px; right: 4px; background: rgba(220,38,38,.9); color: #fff; border: none; border-radius: 50%; width: 26px; height: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: .85rem; }

    .manage-list { display: flex; flex-direction: column; gap: .75rem; margin-top: 1rem; }
    .manage-item {
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-sm); padding: .85rem;
      display: flex; gap: .75rem; align-items: center;
    }
    .manage-item-img { width: 72px; height: 56px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
    .manage-item-info { flex: 1; min-width: 0; }
    .manage-item-title { font-weight: 800; font-size: .92rem; color: var(--text); margin-bottom: .2rem; }
    .manage-item-specs { font-size: .75rem; color: var(--text-2); margin-bottom: .2rem; }
    .manage-item-price { font-weight: 900; color: var(--red); font-size: .88rem; }
    .manage-item-actions { display: flex; gap: .4rem; flex-shrink: 0; }

    /* ── LOGIN ── */
    .login-wrap { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }

        const evs = ['mousedown', 'mousemove', 'keydown', 'touchstart', 'scroll'];
        evs.forEach(e => window.addEventListener(e, resetInactivity, { passive: true }));
        resetInactivity();

        return () => {
          clearTimeout(timeoutId);
          evs.forEach(e => window.removeEventListener(e, resetInactivity));
        };

          setIsAuthenticated(true);

          const nextAttempts = failedAttempts + 1;
          setFailedAttempts(nextAttempts);

                  Estimate monthly bank financing payments for <strong>{calculatorCar.title}</strong> (KES {calcPrice.toLocaleString()}).
                </p>

                <div className="calc-group">
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '.85rem', fontWeight: 700 }}>
                    <span>Deposit ({depositPct}%):</span>
                    <span style={{ color: 'var(--red)' }}>KES {depositAmount.toLocaleString()}</span>
                  </div>
                  <input type="range" min="10" max="60" step="5" value={depositPct} onChange={e => setDepositPct(Number(e.target.value))} className="calc-range" />
                </div>

                <div className="calc-group">
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '.85rem', fontWeight: 700 }}>
                    <span>Repayment Period:</span>
                    <span>{loanMonths} Months ({loanMonths / 12} Years)</span>
                  </div>
                  <input type="range" min="12" max="60" step="6" value={loanMonths} onChange={e => setLoanMonths(Number(e.target.value))} className="calc-range" />
                </div>

                <div className="calc-result-box">
                  <div style={{ fontSize: '.75rem', textTransform: 'uppercase', color: 'var(--text-3)', fontWeight: 700 }}>Estimated Monthly Payment</div>
                  <div style={{ fontSize: '1.75rem', fontWeight: 900, color: 'var(--red)', marginTop: '.2rem' }}>
                    KES {monthlyPayment.toLocaleString()} <span style={{ fontSize: '.85rem', color: 'var(--text-2)', fontWeight: 500 }}>/ mo</span>
                  </div>
                  <div style={{ fontSize: '.75rem', color: 'var(--text-2)', marginTop: '.35rem' }}>
                    Based on ~13.5% p.a. indicative commercial bank rate.
                  </div>
                </div>

                <div style={{ display: 'flex', gap: '.5rem', marginTop: '1rem' }}>
                  <a
                    href={`https://wa.me/${WA_NUM}?text=${encodeURIComponent(`Hi Blue Seal Motor Managers (BMM), I would like to discuss bank financing for ${calculatorCar.title} (Deposit: KES ${depositAmount.toLocaleString()}, ~KES ${monthlyPayment.toLocaleString()}/mo for ${loanMonths} months).`)}`}
                    target="_blank" rel="noopener noreferrer"
                    className="btn btn-primary" style={{ flex: 1 }}
                  >
                    <i className="fa-brands fa-whatsapp"></i> Enquire Financing with Manager
                  </a>
                </div>
              </div>
            </div>
          )}

          {/* Test Drive Booking Modal */}
          {testDriveCar && (
            <div className="modal-overlay" onClick={() => setTestDriveCar(null)}>
              <div className="modal-card" onClick={e => e.stopPropagation()}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
                  <h3 style={{ fontSize: '1.2rem', fontWeight: 900, display: 'flex', alignItems: 'center', gap: '.4rem' }}>
                    <i className="fa-solid fa-calendar-check" style={{ color: 'var(--red)' }}></i> Schedule a Test Drive
                  </h3>
                  <button onClick={() => setTestDriveCar(null)} className="btn btn-ghost btn-sm">✕</button>
                </div>

                <p style={{ fontSize: '.85rem', color: 'var(--text-2)', marginBottom: '1.2rem' }}>
                  Experience <strong>{testDriveCar.title}</strong> at our Kiambu Road showroom.
                </p>

                <form onSubmit={handleTestDriveSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '.75rem' }}>
                  <div>
                    <label className="form-label">Full Name *</label>
                    <input
                      type="text" required placeholder="e.g. John Kamau"
                      value={testDriveForm.name} onChange={e => setTestDriveForm(p => ({ ...p, name: e.target.value }))}
                      className="form-input"
                    />
                  </div>

                  <div>
                    <label className="form-label">Phone / WhatsApp Number *</label>
                    <input
                      type="tel" required placeholder="07XXXXXXXX"
                      value={testDriveForm.phone} onChange={e => setTestDriveForm(p => ({ ...p, phone: e.target.value }))}
                      className="form-input"
                    />
                  </div>

                  <div className="form-grid-2">
                    <div>
                      <label className="form-label">Preferred Date *</label>
                      <input
                        type="date" required
                        value={testDriveForm.date} onChange={e => setTestDriveForm(p => ({ ...p, date: e.target.value }))}
                        className="form-input"
                      />
                    </div>
                    <div>
                      <label className="form-label">Time Slot *</label>
                      <select
                        value={testDriveForm.time} onChange={e => setTestDriveForm(p => ({ ...p, time: e.target.value }))}
                        className="form-select"
                      >
                        <option>Morning (9:00 AM - 12:00 PM)</option>
                        <option>Afternoon (1:00 PM - 4:00 PM)</option>
                        <option>Evening (4:00 PM - 6:00 PM)</option>
                      </select>
                    </div>
                  </div>

                  <button type="submit" className="btn btn-primary btn-lg" style={{ marginTop: '.5rem' }}>
                    <i className="fa-brands fa-whatsapp"></i> Confirm Booking on WhatsApp
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
